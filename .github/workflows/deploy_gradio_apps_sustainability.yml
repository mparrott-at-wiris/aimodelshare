      - deploy-sustainability-upgrade-en
      - deploy-sustainability-upgrade-ca
      - deploy-sustainability-upgrade-es
      - deploy-moral-compass-en-sustainability
      - deploy-moral-compass-es-sustainability
      - deploy-moral-compass-ca-sustainability
    steps:
      - name: Generate JSON of deployed URLs
        run: |
          cat > deployed_urls.json <<'EOF'
          {
            "model-building-game-en-sustainability": "${{ needs.deploy-model-building-game-en-sustainability.outputs.url }}",
            "model-building-game-ca-sustainability": "${{ needs.deploy-model-building-game-ca-sustainability.outputs.url }}",
            "model-building-game-es-sustainability": "${{ needs.deploy-model-building-game-es-sustainability.outputs.url }}",
            "model-building-game-en-final-sustainability": "${{ needs.deploy-model-building-game-en-final-sustainability.outputs.url }}",
            "model-building-game-es-final-sustainability": "${{ needs.deploy-model-building-game-es-final-sustainability.outputs.url }}",
            "model-building-game-ca-final-sustainability": "${{ needs.deploy-model-building-game-ca-final-sustainability.outputs.url }}",
            "bias-detective-en-sustainability": "${{ needs.deploy-bias-detective-en-sustainability.outputs.url }}",
            "bias-detective-ca-sustainability": "${{ needs.deploy-bias-detective-ca-sustainability.outputs.url }}",
            "bias-detective-es-sustainability": "${{ needs.deploy-bias-detective-es-sustainability.outputs.url }}",
            "fairness-fixer-en-sustainability": "${{ needs.deploy-fairness-fixer-en-sustainability.outputs.url }}",
            "fairness-fixer-ca-sustainability": "${{ needs.deploy-fairness-fixer-ca-sustainability.outputs.url }}",
            "fairness-fixer-es-sustainability": "${{ needs.deploy-fairness-fixer-es-sustainability.outputs.url }}",
            "sustainability-upgrade-en": "${{ needs.deploy-sustainability-upgrade-en.outputs.url }}",
            "sustainability-upgrade-ca": "${{ needs.deploy-sustainability-upgrade-ca.outputs.url }}",
            "sustainability-upgrade-es": "${{ needs.deploy-sustainability-upgrade-es.outputs.url }}",
            "moral-compass-en-sustainability": "${{ needs.deploy-moral-compass-en-sustainability.outputs.url }}",
            "moral-compass-es-sustainability": "${{ needs.deploy-moral-compass-es-sustainability.outputs.url }}",
            "moral-compass-ca-sustainability": "${{ needs.deploy-moral-compass-ca-sustainability.outputs.url }}"
          }
          EOF
          echo "Deployed service URLs JSON:"
          cat deployed_urls.json
      - name: Upload deployed_urls.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployed-urls
          path: deployed_urls.json
      - name: Append URLs to summary
        run: |
          {
            echo "### Deployed Sustainability App URLs"
            echo ""
            echo '```json'
            cat deployed_urls.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
