name: Load Test Gradio Apps

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'App to test (or "all" for all apps)'
        required: true
        default: 'judge'
        type: choice
        options:
          - all
          - judge
          - ai-consequences
          - what-is-ai
          - tutorial
          - model-building-game-en
          - model-building-game-es
          - model-building-game-ca
          - ethical-revelation
          - moral-compass-challenge
      num_users:
        description: 'Number of concurrent users'
        required: true
        default: '100'
        type: string
      spawn_rate:
        description: 'Users spawned per second'
        required: true
        default: '10'
        type: string
      run_time:
        description: 'Test duration (e.g., 5m, 300s)'
        required: true
        default: '5m'
        type: string
  
  # Allow triggering after deployment
  workflow_call:
    inputs:
      target_app:
        description: 'App to test'
        required: true
        type: string
      num_users:
        description: 'Number of concurrent users'
        required: false
        default: '50'
        type: string
      spawn_rate:
        description: 'Users spawned per second'
        required: false
        default: '5'
        type: string
      run_time:
        description: 'Test duration'
        required: false
        default: '3m'
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1

jobs:
  load-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # If 'all' is selected, test multiple key apps
        # Otherwise, test just the selected app
        app: ${{ github.event.inputs.target_app == 'all' && fromJSON('["judge", "ai-consequences", "what-is-ai", "model-building-game-en"]') || fromJSON(format('["{0}"]', github.event.inputs.target_app)) }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Load Test Dependencies
        run: |
          pip install --upgrade pip
          pip install -r tests/load_tests/requirements.txt
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Get App URL
        id: get-url
        run: |
          # Get the Cloud Run service URL
          SERVICE_NAME="${{ matrix.app }}"
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region=${{ env.REGION }} \
            --format='value(status.url)' 2>/dev/null || echo "")
          
          if [ -z "$URL" ]; then
            echo "❌ Service $SERVICE_NAME not found or not deployed"
            echo "url=" >> $GITHUB_OUTPUT
            echo "deployed=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Found service URL: $URL"
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "deployed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Run Load Test
        if: steps.get-url.outputs.deployed == 'true'
        run: |
          cd tests/load_tests
          
          echo "🚀 Starting load test for ${{ matrix.app }}"
          echo "  URL: ${{ steps.get-url.outputs.url }}"
          echo "  Users: ${{ github.event.inputs.num_users || '50' }}"
          echo "  Spawn Rate: ${{ github.event.inputs.spawn_rate || '5' }}"
          echo "  Duration: ${{ github.event.inputs.run_time || '3m' }}"
          
          # Determine user class based on app type
          USER_CLASS="GradioAppUser"
          if [[ "${{ matrix.app }}" == model-building-game-* ]]; then
            USER_CLASS="ModelBuildingGameUser"
          fi
          
          # Run locust in headless mode
          locust -f locustfile_gradio_apps.py \
            --host=${{ steps.get-url.outputs.url }} \
            --users ${{ github.event.inputs.num_users || '50' }} \
            --spawn-rate ${{ github.event.inputs.spawn_rate || '5' }} \
            --run-time ${{ github.event.inputs.run_time || '3m' }} \
            --headless \
            --html=load_test_report_${{ matrix.app }}.html \
            --csv=load_test_results_${{ matrix.app }} \
            --user-class $USER_CLASS \
            || true  # Don't fail workflow on test failures
          
          echo "✅ Load test complete"
      
      - name: Parse Test Results
        if: steps.get-url.outputs.deployed == 'true'
        id: parse-results
        run: |
          cd tests/load_tests
          
          # Check if CSV results exist
          if [ ! -f "load_test_results_${{ matrix.app }}_stats.csv" ]; then
            echo "⚠️  No results file found"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Parse CSV results (skip header, get totals)
          STATS=$(tail -n 1 "load_test_results_${{ matrix.app }}_stats.csv")
          
          # Extract metrics (CSV format: Type,Name,Request Count,Failure Count,...)
          TOTAL_REQUESTS=$(echo "$STATS" | cut -d',' -f3)
          FAILED_REQUESTS=$(echo "$STATS" | cut -d',' -f4)
          MEDIAN_TIME=$(echo "$STATS" | cut -d',' -f5)
          AVG_TIME=$(echo "$STATS" | cut -d',' -f6)
          
          # Calculate success rate
          if [ "$TOTAL_REQUESTS" -gt 0 ]; then
            SUCCESS_RATE=$(echo "scale=2; (($TOTAL_REQUESTS - $FAILED_REQUESTS) / $TOTAL_REQUESTS) * 100" | bc)
          else
            SUCCESS_RATE=0
          fi
          
          # Determine if test passed based on criteria
          PASS="true"
          if (( $(echo "$SUCCESS_RATE < 99" | bc -l) )); then
            PASS="false"
          fi
          
          echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
          echo "total_requests=$TOTAL_REQUESTS" >> $GITHUB_OUTPUT
          echo "failed_requests=$FAILED_REQUESTS" >> $GITHUB_OUTPUT
          echo "median_time=$MEDIAN_TIME" >> $GITHUB_OUTPUT
          echo "avg_time=$AVG_TIME" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT
      
      - name: Upload Test Report
        if: steps.get-url.outputs.deployed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report-${{ matrix.app }}
          path: |
            tests/load_tests/load_test_report_${{ matrix.app }}.html
            tests/load_tests/load_test_results_${{ matrix.app }}_*.csv
          retention-days: 30
      
      - name: Comment Results Summary
        if: steps.get-url.outputs.deployed == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "## 📊 Load Test Results - ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Users: ${{ github.event.inputs.num_users || '50' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Spawn Rate: ${{ github.event.inputs.spawn_rate || '5' }}/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${{ github.event.inputs.run_time || '3m' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Total Requests: ${{ steps.parse-results.outputs.total_requests }}" >> $GITHUB_STEP_SUMMARY
          echo "- Failed Requests: ${{ steps.parse-results.outputs.failed_requests }}" >> $GITHUB_STEP_SUMMARY
          echo "- Success Rate: ${{ steps.parse-results.outputs.success_rate }}%" >> $GITHUB_STEP_SUMMARY
          echo "- Median Response Time: ${{ steps.parse-results.outputs.median_time }}ms" >> $GITHUB_STEP_SUMMARY
          echo "- Average Response Time: ${{ steps.parse-results.outputs.avg_time }}ms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.parse-results.outputs.pass }}" == "true" ]; then
            echo "✅ **Status:** PASS (Success Rate > 99%)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** FAIL (Success Rate < 99%)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Download the full HTML report from artifacts for detailed analysis." >> $GITHUB_STEP_SUMMARY
      
      - name: Skip Test Notice
        if: steps.get-url.outputs.deployed == 'false'
        run: |
          echo "## ⚠️  Load Test Skipped - ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Service not found or not deployed. Please deploy the app first." >> $GITHUB_STEP_SUMMARY

  summary:
    runs-on: ubuntu-latest
    needs: load-test
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🎯 Load Test Campaign Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Target: **${{ github.event.inputs.target_app || 'N/A' }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All test results are available in the artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review individual app reports in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Check Cloud Run metrics for resource utilization" >> $GITHUB_STEP_SUMMARY
          echo "3. Adjust configuration if needed (memory, CPU, concurrency)" >> $GITHUB_STEP_SUMMARY
