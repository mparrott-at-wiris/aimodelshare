name: Build WiDS Prediction Cache Artifact (Resumable)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # Required to list/download artifacts
  checks: write

jobs:
  build-wids-cache-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install pandas numpy scikit-learn joblib

      # Restore Checkpoint
      - name: Restore Checkpoint
        uses: dawidd6/action-download-artifact@v6
        with:
          name: wids-cache-checkpoint
          path: .
          search_artifacts: true
          workflow_conclusion: "" 
          if_no_artifact_found: warn
        continue-on-error: true

      # Debug Step (Line 36 in your original)
      - name: Debug Checkpoint
        run: |
          # CHANGE THIS LINE TO .gz
          if [ -f "wids_cache_checkpoint.jsonl.gz" ]; then
            echo "✅ SUCCESS: Checkpoint found!"
          else
            echo "⚠️ NOTE: No checkpoint found. Normal for first run."
          fi

      # Run the script
      - name: Run Compute Chunk
        run: |
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          python precompute_wids_cache.py

      # Save Checkpoint (Runs even if timeout occurs)
      - name: Save Checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wids-cache-checkpoint
          # CHANGE THIS LINE TO .gz
          path: wids_cache_checkpoint.jsonl.gz
          retention-days: 5

      # Save Final Result (Only if the script finishes 100%)
      - name: Save Final Artifact
        if: hashFiles('wids_prediction_cache.json.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wids-prediction-cache-file
          path: wids_prediction_cache.json.gz
          retention-days: 90
